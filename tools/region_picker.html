<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Region Picker</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #e4e4e4;
        user-select: none;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        background: #252525;
        border-bottom: 1px solid #333;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar button,
      .toolbar select {
        background: #2d2d2d;
        color: #e4e4e4;
        border: 1px solid #444;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .toolbar button:hover {
        background: #383838;
      }
      .toolbar button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: white;
      }
      .toolbar button.primary:hover {
        background: #1d4ed8;
      }
      .toolbar button.active {
        background: #2563eb;
        border-color: #2563eb;
        color: white;
      }
      .toolbar .sep {
        width: 1px;
        height: 22px;
        background: #444;
        margin: 0 4px;
      }
      .toolbar .label {
        font-size: 12px;
        color: #888;
      }
      .toolbar .spacer {
        flex: 1;
      }
      .toolbar #dirty-indicator {
        color: #f59e0b;
        font-size: 12px;
      }
      .toolbar #dirty-indicator.hidden {
        visibility: hidden;
      }
      .toolbar #crop-banner {
        color: #f59e0b;
        font-size: 12px;
        font-weight: 500;
      }
      .toolbar #crop-banner.hidden {
        display: none;
      }
      .zoom-btn {
        width: 32px;
        padding: 6px 0 !important;
        text-align: center;
        font-weight: bold;
      }

      .main {
        display: grid;
        grid-template-columns: 1fr 360px;
        min-height: 0;
      }
      .canvas-wrap {
        position: relative;
        overflow: hidden;
        background: #0f0f0f;
      }
      canvas {
        display: block;
        cursor: crosshair;
      }
      canvas.panning {
        cursor: grabbing;
      }
      canvas.hand {
        cursor: grab;
      }
      canvas.over-region {
        cursor: move;
      }
      canvas.over-handle {
        cursor: nwse-resize;
      }
      canvas.cropping {
        cursor: crosshair;
      }

      .sidebar {
        background: #1a1a1a;
        border-left: 1px solid #333;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid #333;
        background: #1f1f1f;
      }
      .tabs button {
        flex: 1;
        background: transparent;
        border: 0;
        padding: 10px 12px;
        color: #888;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 2px solid transparent;
      }
      .tabs button:hover {
        background: #232323;
      }
      .tabs button.active {
        color: #fff;
        border-bottom-color: #2563eb;
      }

      .sidebar-head {
        padding: 8px 12px;
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sidebar-head button {
        background: #2d2d2d;
        border: 1px solid #444;
        color: #e4e4e4;
        padding: 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
      }
      .sidebar-head button:hover {
        background: #383838;
      }
      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }

      /* coords list rows */
      .region-row {
        padding: 6px 12px;
        cursor: pointer;
        border-left: 3px solid transparent;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .region-row:hover {
        background: #232323;
      }
      .region-row.selected {
        background: #1e3a8a33;
        border-left-color: #2563eb;
      }
      .region-row .name-cell {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .region-row .meta {
        font-size: 11px;
        color: #888;
        font-family: monospace;
      }
      .region-row .badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: #059669;
        min-width: 16px;
        text-align: center;
        font-weight: bold;
      }
      .region-row .badge.p {
        background: #7c3aed;
      }

      /* item rows */
      .item-row {
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #222;
      }
      .item-row .thumb {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        background: #0a0a0a url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><text x=%2224%22 y=%2228%22 fill=%22%23444%22 text-anchor=%22middle%22 font-size=%2220%22 font-family=%22sans-serif%22>—</text></svg>') center/contain no-repeat;
        border: 1px solid #2a2a2a;
        border-radius: 3px;
        image-rendering: pixelated;
      }
      .item-row .thumb.has-image {
        background-color: #1a1a1a;
        background-image: none;
      }
      .item-row .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .item-row .body {
        flex: 1;
        min-width: 0;
      }
      .item-row .name {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-row .image-file {
        font-size: 11px;
        color: #666;
        font-family: monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-row.has-image .name {
        color: #e4e4e4;
      }
      .item-row.no-image .name {
        color: #888;
      }
      .item-row .actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      .item-row button {
        background: #2d2d2d;
        border: 1px solid #444;
        color: #ddd;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
      }
      .item-row button.cap {
        background: #f59e0b;
        border-color: #f59e0b;
        color: #000;
        font-weight: 500;
      }
      .item-row button:hover {
        filter: brightness(1.15);
      }
      .item-row.active-crop {
        background: #1e3a8a33;
      }

      .editor {
        border-top: 1px solid #333;
        padding: 12px;
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .editor.visible {
        display: flex;
      }
      .editor input {
        background: #0f0f0f;
        border: 1px solid #444;
        color: #e4e4e4;
        padding: 6px 8px;
        border-radius: 3px;
        font-size: 13px;
        font-family: monospace;
      }
      .editor label {
        font-size: 11px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .editor .grid4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .editor button.danger {
        background: #b91c1c;
        border-color: #b91c1c;
        color: white;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
        border: 0;
      }

      .status {
        display: flex;
        gap: 16px;
        padding: 6px 12px;
        background: #252525;
        border-top: 1px solid #333;
        font-family: monospace;
        font-size: 12px;
        color: #888;
      }
      .status #status-hint {
        margin-left: auto;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        pointer-events: none;
        font-size: 14px;
        text-align: center;
        padding: 20px;
      }
      .toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: #059669;
        color: white;
        padding: 10px 18px;
        border-radius: 4px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 200;
      }
      .toast.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <span class="label">Res:</span>
      <select id="res-select"></select>
      <button
        id="res-new"
        title="Crear una nueva resolución">
        + Nueva
      </button>

      <div class="sep"></div>
      <span class="label">Tipo:</span>
      <select id="type-select"></select>

      <div class="sep"></div>
      <button
        id="mode-rect"
        title="R">
        + Rect
      </button>
      <button
        id="mode-point"
        title="P">
        + Punto
      </button>

      <div class="sep"></div>
      <button
        id="zoom-out"
        class="zoom-btn"
        title="Zoom out (−)">
        −
      </button>
      <button
        id="zoom-in"
        class="zoom-btn"
        title="Zoom in (+)">
        +
      </button>
      <button
        id="zoom-fit"
        title="Fit (F)">
        Fit
      </button>

      <div class="sep"></div>
      <button
        id="isolate"
        title="Solo seleccionado (I)">
        Aislar
      </button>
      <button
        id="capture"
        title="Captura el screenshot del tipo activo (Ctrl+P)">
        Capturar tipo
      </button>

      <span class="spacer"></span>
      <span
        id="crop-banner"
        class="hidden"
        >Recortando: <b id="crop-banner-name">—</b> · Esc cancela</span
      >
      <span
        id="dirty-indicator"
        class="hidden"
        >● sin guardar</span
      >
      <button
        id="save"
        class="primary">
        Guardar (Ctrl+S)
      </button>
    </div>

    <div class="main">
      <div class="canvas-wrap">
        <canvas id="c"></canvas>
        <div
          class="empty-state"
          id="empty">
          Cargando…
        </div>
      </div>
      <div class="sidebar">
        <div class="tabs">
          <button
            id="tab-coords"
            class="active">
            Coords
          </button>
          <button id="tab-items">Items</button>
        </div>

        <!-- COORDS -->
        <div
          id="panel-coords"
          style="display: flex; flex-direction: column; min-height: 0; flex: 1">
          <div class="sidebar-head">
            <span><span id="active-type-label">—</span> · <span id="count">0</span></span>
          </div>
          <div
            class="sidebar-list"
            id="list"></div>
          <div
            class="editor"
            id="editor">
            <div>
              <label>Nombre</label>
              <input
                type="text"
                id="ed-name"
                autocomplete="off" />
            </div>
            <div class="grid4">
              <div>
                <label>X</label
                ><input
                  type="number"
                  id="ed-x" />
              </div>
              <div>
                <label>Y</label
                ><input
                  type="number"
                  id="ed-y" />
              </div>
              <div id="ed-w-wrap">
                <label>W</label
                ><input
                  type="number"
                  id="ed-w" />
              </div>
              <div id="ed-h-wrap">
                <label>H</label
                ><input
                  type="number"
                  id="ed-h" />
              </div>
            </div>
            <button
              class="danger"
              id="ed-delete">
              Borrar
            </button>
          </div>
        </div>

        <!-- ITEMS -->
        <div
          id="panel-items"
          style="display: none; flex-direction: column; min-height: 0; flex: 1">
          <div class="sidebar-head">
            <span><span id="items-count">0</span> items · <span id="items-with-png">0</span> con PNG</span>
            <button id="items-new">+ Nuevo</button>
          </div>
          <div
            class="sidebar-list"
            id="items-list"></div>
        </div>
      </div>
    </div>

    <div class="status">
      <span id="status-pos">x=- y=-</span>
      <span id="status-zoom">zoom: 100%</span>
      <span id="status-hint">R/P crear · scroll/+/− zoom · F fit · I aislar · Esc nav · Del borra · Ctrl+S/Z/P</span>
    </div>

    <div
      class="toast"
      id="toast"></div>

    <script>
      'use strict'

      const state = {
        resolutions: [],
        activeRes: null,
        coords: null,
        activeType: null,
        // coordenadas: rect/point
        regions: [],
        // items: { name, image, hasImage, thumbVer }
        items: [],
        imagesByType: {},
        image: null,
        selectedId: null,
        mode: 'navigate', // navigate | rect | point | crop-item
        cropTarget: null, // ref al item siendo recortado en crop-item mode
        view: { scale: 1, offsetX: 0, offsetY: 0 },
        drag: null,
        nextId: 1,
        spaceDown: false,
        dirty: false,
        isolate: false,
        activeTab: 'coords',
      }

      const HANDLE_SIZE = 8
      const POINT_RADIUS = 6
      const COLOR_RECT = '#10b981'
      const COLOR_POINT = '#a78bfa'
      const COLOR_SEL = '#3b82f6'

      const $ = (id) => document.getElementById(id)
      const canvas = $('c'),
        ctx = canvas.getContext('2d')
      const empty = $('empty')
      const listEl = $('list'),
        countEl = $('count')
      const itemsListEl = $('items-list')
      const itemsCountEl = $('items-count'),
        itemsPngEl = $('items-with-png')
      const editorEl = $('editor')
      const edName = $('ed-name'),
        edX = $('ed-x'),
        edY = $('ed-y'),
        edW = $('ed-w'),
        edH = $('ed-h')
      const edWWrap = $('ed-w-wrap'),
        edHWrap = $('ed-h-wrap')
      const edDelete = $('ed-delete')
      const statusPos = $('status-pos'),
        statusZoom = $('status-zoom')
      const toastEl = $('toast')
      const resSelect = $('res-select'),
        typeSelect = $('type-select')
      const activeTypeLabel = $('active-type-label')
      const dirtyIndicator = $('dirty-indicator')
      const cropBanner = $('crop-banner'),
        cropBannerName = $('crop-banner-name')

      // ============================================================================
      // Coord transforms
      // ============================================================================
      function s2i(sx, sy) {
        return { x: Math.round((sx - state.view.offsetX) / state.view.scale), y: Math.round((sy - state.view.offsetY) / state.view.scale) }
      }
      function i2s(ix, iy) {
        return { x: ix * state.view.scale + state.view.offsetX, y: iy * state.view.scale + state.view.offsetY }
      }

      // ============================================================================
      // Drawing
      // ============================================================================
      let drawScheduled = false
      function scheduleDraw() {
        if (drawScheduled) return
        drawScheduled = true
        requestAnimationFrame(() => {
          drawScheduled = false
          draw()
        })
      }

      function resizeCanvas() {
        const wrap = canvas.parentElement
        canvas.width = wrap.clientWidth
        canvas.height = wrap.clientHeight
        draw()
      }

      function draw() {
        ctx.fillStyle = '#0f0f0f'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        if (state.image) {
          ctx.imageSmoothingEnabled = state.view.scale < 1
          ctx.drawImage(state.image, state.view.offsetX, state.view.offsetY, state.image.width * state.view.scale, state.image.height * state.view.scale)
        }

        if (state.mode === 'crop-item') {
          // En modo crop-item ocultamos las coords para no estorbar
          if (state.drag && state.drag.kind === 'new-rect') {
            const { startX, startY, currentX, currentY } = state.drag
            drawRect(Math.min(startX, currentX), Math.min(startY, currentY), Math.abs(currentX - startX), Math.abs(currentY - startY), '#f59e0b', '#f59e0b33', 'crop')
          }
          return
        }

        const visible = state.isolate ? state.regions.filter((r) => r.id === state.selectedId) : state.regions
        for (const r of visible) drawRegion(r, r.id === state.selectedId)

        if (state.drag && state.drag.kind === 'new-rect') {
          const { startX, startY, currentX, currentY } = state.drag
          drawRect(Math.min(startX, currentX), Math.min(startY, currentY), Math.abs(currentX - startX), Math.abs(currentY - startY), '#60a5fa', '#60a5fa33', '(nuevo)')
        }
      }

      function drawRegion(r, isSel) {
        const color = isSel ? COLOR_SEL : r.kind === 'point' ? COLOR_POINT : COLOR_RECT
        if (r.kind === 'point') {
          drawPoint(r.x, r.y, color, r.name)
        } else {
          drawRect(r.x, r.y, r.w, r.h, color, color + '22', r.name)
          if (isSel) drawHandles(r)
        }
      }

      function drawRect(ix, iy, iw, ih, stroke, fill, label) {
        const a = i2s(ix, iy)
        const sw = iw * state.view.scale,
          sh = ih * state.view.scale
        ctx.fillStyle = fill
        ctx.fillRect(a.x, a.y, sw, sh)
        ctx.strokeStyle = stroke
        ctx.lineWidth = 2
        ctx.strokeRect(a.x, a.y, sw, sh)
        if (label) {
          ctx.font = '12px system-ui, sans-serif'
          const w = ctx.measureText(label).width + 8
          ctx.fillStyle = stroke
          ctx.fillRect(a.x, a.y - 24, w, 18)
          ctx.fillStyle = '#000'
          ctx.fillText(label, a.x + 4, a.y - 11)
        }
      }
      function drawHandles(r) {
        for (const c of [
          { x: r.x, y: r.y },
          { x: r.x + r.w, y: r.y },
          { x: r.x, y: r.y + r.h },
          { x: r.x + r.w, y: r.y + r.h },
        ]) {
          const s = i2s(c.x, c.y)
          ctx.fillStyle = COLOR_SEL
          ctx.fillRect(s.x - HANDLE_SIZE / 2, s.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE)
          ctx.strokeStyle = '#000'
          ctx.lineWidth = 1
          ctx.strokeRect(s.x - HANDLE_SIZE / 2, s.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE)
        }
      }
      function drawPoint(ix, iy, color, label) {
        const s = i2s(ix, iy)
        ctx.beginPath()
        ctx.arc(s.x, s.y, POINT_RADIUS, 0, Math.PI * 2)
        ctx.fillStyle = color + '44'
        ctx.fill()
        ctx.strokeStyle = color
        ctx.lineWidth = 2
        ctx.stroke()
        ctx.beginPath()
        ctx.moveTo(s.x - 10, s.y)
        ctx.lineTo(s.x + 10, s.y)
        ctx.moveTo(s.x, s.y - 10)
        ctx.lineTo(s.x, s.y + 10)
        ctx.stroke()
        if (label) {
          ctx.font = '12px system-ui, sans-serif'
          const w = ctx.measureText(label).width + 8
          ctx.fillStyle = color
          ctx.fillRect(s.x + 14, s.y - 9, w, 18)
          ctx.fillStyle = '#000'
          ctx.fillText(label, s.x + 18, s.y + 4)
        }
      }
      function pointLabelBoxImage(r) {
        ctx.font = '12px system-ui, sans-serif'
        const textW = ctx.measureText(r.name).width
        const s = state.view.scale
        return { left: r.x + 14 / s, right: r.x + (14 + textW + 8) / s, top: r.y - 9 / s, bottom: r.y + 9 / s }
      }

      // ============================================================================
      // Hit testing (solo para coords; en crop-item solo se arrastra rect)
      // ============================================================================
      function getRegion(id) {
        return state.regions.find((r) => r.id === id)
      }

      function hitTestRegions(ix, iy) {
        const sel = getRegion(state.selectedId)
        if (sel && sel.kind === 'rect') {
          const handle = hitTestHandle(sel, ix, iy)
          if (handle) return { kind: 'handle', region: sel, handle }
        }
        const pool = state.isolate ? state.regions.filter((r) => r.id === state.selectedId) : state.regions
        const hitRadiusSq = (14 / state.view.scale) ** 2
        let bestPt = null,
          bestDist = Infinity
        for (const r of pool) {
          if (r.kind !== 'point') continue
          const d2 = (ix - r.x) ** 2 + (iy - r.y) ** 2
          if (d2 <= hitRadiusSq && d2 < bestDist) {
            bestDist = d2
            bestPt = r
          }
        }
        if (bestPt) return { kind: 'body', region: bestPt }
        for (let i = pool.length - 1; i >= 0; i--) {
          const r = pool[i]
          if (r.kind !== 'point') continue
          const lb = pointLabelBoxImage(r)
          if (ix >= lb.left && ix <= lb.right && iy >= lb.top && iy <= lb.bottom) {
            return { kind: 'body', region: r }
          }
        }
        for (let i = pool.length - 1; i >= 0; i--) {
          const r = pool[i]
          if (r.kind === 'point') continue
          if (ix >= r.x && ix <= r.x + r.w && iy >= r.y && iy <= r.y + r.h) {
            return { kind: 'body', region: r }
          }
        }
        return null
      }

      function hitTestHandle(r, ix, iy) {
        const hs = HANDLE_SIZE / state.view.scale
        const corners = [
          { name: 'nw', x: r.x, y: r.y },
          { name: 'ne', x: r.x + r.w, y: r.y },
          { name: 'sw', x: r.x, y: r.y + r.h },
          { name: 'se', x: r.x + r.w, y: r.y + r.h },
        ]
        for (const c of corners) {
          if (Math.abs(ix - c.x) <= hs && Math.abs(iy - c.y) <= hs) return c.name
        }
        return null
      }

      // ============================================================================
      // Coords sidebar
      // ============================================================================
      function badgeFor(r) {
        return r.kind === 'point' ? `<span class="badge p">P</span>` : `<span class="badge">R</span>`
      }
      function metaFor(r) {
        return r.kind === 'point' ? `${r.x},${r.y}` : `${r.x},${r.y} ${r.w}×${r.h}`
      }
      function wireRow(row, r) {
        row.addEventListener('click', () => selectRegion(r.id))
        const cell = row.querySelector('.name-cell')
        if (cell) cell.addEventListener('dblclick', (e) => { e.stopPropagation(); startInlineRename(cell, r) })
      }
      function renderList() {
        countEl.textContent = state.regions.length
        listEl.innerHTML = ''
        for (const r of state.regions) {
          const row = document.createElement('div')
          row.className = 'region-row' + (r.id === state.selectedId ? ' selected' : '')
          row.dataset.regionId = r.id
          row.innerHTML = `${badgeFor(r)}<span class="name-cell" title="doble-click para renombrar">${escapeHtml(r.name)}</span><span class="meta">${metaFor(r)}</span>`
          wireRow(row, r)
          listEl.appendChild(row)
        }
        renderEditor()
      }
      function updateListRow(r) {
        const row = listEl.querySelector(`[data-region-id="${r.id}"]`)
        if (!row) return
        row.innerHTML = `${badgeFor(r)}<span class="name-cell" title="doble-click para renombrar">${escapeHtml(r.name)}</span><span class="meta">${metaFor(r)}</span>`
        wireRow(row, r)
      }
      function startInlineRename(cell, r) {
        const original = r.name
        const input = document.createElement('input')
        input.type = 'text'
        input.value = original
        input.style.cssText = 'width:100%;background:#1a1a1a;color:#e4e4e4;border:1px solid #2563eb;border-radius:3px;padding:2px 4px;font-size:13px;font-family:inherit;'
        cell.replaceWith(input)
        input.focus(); input.select()
        let done = false
        const commit = () => {
          if (done) return
          done = true
          const v = input.value.trim() || original
          r.name = v
          markDirty()
          updateListRow(r)
          renderEditor()
        }
        const cancel = () => {
          if (done) return
          done = true
          updateListRow(r)
        }
        input.addEventListener('blur', commit)
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur() }
          if (e.key === 'Escape') { e.preventDefault(); cancel(); input.blur() }
        })
      }
      function renderEditor() {
        const r = getRegion(state.selectedId)
        if (!r) {
          editorEl.classList.remove('visible')
          return
        }
        editorEl.classList.add('visible')
        edName.value = r.name
        edX.value = r.x
        edY.value = r.y
        if (r.kind === 'rect') {
          edWWrap.style.display = ''
          edHWrap.style.display = ''
          edW.value = r.w
          edH.value = r.h
        } else {
          edWWrap.style.display = 'none'
          edHWrap.style.display = 'none'
        }
      }
      function escapeHtml(s) {
        return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      }

      // ============================================================================
      // Items sidebar
      // ============================================================================
      function renderItems() {
        itemsCountEl.textContent = state.items.length
        itemsPngEl.textContent = state.items.filter((it) => it.hasImage).length
        itemsListEl.innerHTML = ''
        for (const it of state.items) {
          const row = document.createElement('div')
          row.className = 'item-row ' + (it.hasImage ? 'has-image' : 'no-image')
          row.dataset.itemName = it.name

          const thumb = document.createElement('div')
          thumb.className = 'thumb' + (it.hasImage ? ' has-image' : '')
          if (it.hasImage) {
            const im = document.createElement('img')
            im.src = `/item/${state.activeRes}/${encodeURIComponent(it.image)}?v=${it.thumbVer || 0}`
            thumb.appendChild(im)
          }

          const body = document.createElement('div')
          body.className = 'body'
          body.innerHTML = `<div class="name">${escapeHtml(it.name)}</div>
                      <div class="image-file">${escapeHtml(it.image)}</div>`

          const actions = document.createElement('div')
          actions.className = 'actions'
          const capBtn = document.createElement('button')
          capBtn.className = 'cap'
          capBtn.textContent = it.hasImage ? 'Recapturar' : 'Capturar'
          capBtn.title = 'Arrastra un rect sobre el icono en el canvas'
          capBtn.addEventListener('click', () => startItemCrop(it))
          actions.appendChild(capBtn)
          const delBtn = document.createElement('button')
          delBtn.textContent = '✕'
          delBtn.title = 'Borrar item'
          delBtn.addEventListener('click', () => deleteItem(it))
          actions.appendChild(delBtn)

          row.append(thumb, body, actions)
          itemsListEl.appendChild(row)
        }
      }

      async function checkItemsHaveImage() {
        // Pinta optimista; los <img> que devuelvan 404 quedan rotos. Para evitar
        // imagen rota visible, comprobamos antes con HEAD.
        await Promise.all(
          state.items.map(async (it) => {
            try {
              const r = await fetch(`/item/${state.activeRes}/${encodeURIComponent(it.image)}`, { method: 'HEAD' })
              it.hasImage = r.ok
            } catch {
              it.hasImage = false
            }
          }),
        )
      }

      async function reloadItemThumb(it) {
        try {
          const r = await fetch(`/item/${state.activeRes}/${encodeURIComponent(it.image)}`, { method: 'HEAD' })
          it.hasImage = r.ok
          it.thumbVer = (it.thumbVer || 0) + 1
        } catch {}
        renderItems()
      }

      function deleteItem(it) {
        if (!confirm(`¿Borrar item "${it.name}" del JSON? (No borra el PNG)`)) return
        state.items = state.items.filter((x) => x !== it)
        markDirty()
        renderItems()
      }

      $('items-new').addEventListener('click', () => {
        const name = prompt('Nombre del item (ej: lucent_motes):')
        if (!name || !name.trim()) return
        const clean = name.trim().toLowerCase().replace(/\s+/g, '_')
        if (state.items.some((x) => x.name === clean)) {
          toast('Ya existe un item con ese nombre', true)
          return
        }
        state.items.push({ name: clean, image: clean + '.png', hasImage: false })
        markDirty()
        renderItems()
      })

      // ============================================================================
      // Tabs
      // ============================================================================
      function setTab(tab) {
        state.activeTab = tab
        $('tab-coords').classList.toggle('active', tab === 'coords')
        $('tab-items').classList.toggle('active', tab === 'items')
        $('panel-coords').style.display = tab === 'coords' ? 'flex' : 'none'
        $('panel-items').style.display = tab === 'items' ? 'flex' : 'none'
      }
      $('tab-coords').addEventListener('click', () => setTab('coords'))
      $('tab-items').addEventListener('click', () => setTab('items'))

      // ============================================================================
      // Region ops (coords)
      // ============================================================================
      function selectRegion(id) {
        state.selectedId = id
        for (const r of state.regions) {
          const row = listEl.querySelector(`[data-region-id="${r.id}"]`)
          if (row) row.classList.toggle('selected', r.id === id)
        }
        renderEditor()
        scheduleDraw()
      }
      function addRect(x, y, w, h) {
        if (w < 2 || h < 2) return null
        const r = { id: state.nextId++, kind: 'rect', name: defaultName('rect'), x, y, w, h }
        state.regions.push(r)
        markDirty()
        renderList()
        selectRegion(r.id)
        edName.focus()
        edName.select()
        return r
      }
      function addPoint(x, y) {
        const r = { id: state.nextId++, kind: 'point', name: defaultName('point'), x, y }
        state.regions.push(r)
        markDirty()
        renderList()
        selectRegion(r.id)
        edName.focus()
        edName.select()
        return r
      }
      function defaultName(kind) {
        const prefix = kind === 'rect' ? 'REGION_' : 'point_'
        let n = 1
        while (state.regions.some((r) => r.name === prefix + n)) n++
        return prefix + n
      }
      function deleteRegion(id) {
        state.regions = state.regions.filter((r) => r.id !== id)
        if (state.selectedId === id) state.selectedId = null
        markDirty()
        renderList()
        scheduleDraw()
      }

      // Editor inputs
      function bindEditorInput(input, key) {
        input.addEventListener('input', () => {
          const r = getRegion(state.selectedId)
          if (!r) return
          if (key === 'name') {
            r.name = input.value.trim() || defaultName(r.kind)
          } else {
            const v = parseInt(input.value, 10)
            if (Number.isNaN(v)) return
            r[key] = v
          }
          markDirty()
          updateListRow(r)
          scheduleDraw()
        })
      }
      bindEditorInput(edName, 'name')
      bindEditorInput(edX, 'x')
      bindEditorInput(edY, 'y')
      bindEditorInput(edW, 'w')
      bindEditorInput(edH, 'h')
      edDelete.addEventListener('click', () => {
        if (state.selectedId) deleteRegion(state.selectedId)
      })

      // ============================================================================
      // Crop item mode
      // ============================================================================
      function startItemCrop(it) {
        if (!state.image) {
          toast('Necesitas la imagen del tipo (Capturar tipo)', true)
          return
        }
        state.mode = 'crop-item'
        state.cropTarget = it
        cropBanner.classList.remove('hidden')
        cropBannerName.textContent = it.name
        canvas.classList.add('cropping')
        // resalta la fila
        for (const r of itemsListEl.querySelectorAll('.item-row')) r.classList.remove('active-crop')
        const row = itemsListEl.querySelector(`[data-item-name="${CSS.escape(it.name)}"]`)
        if (row) row.classList.add('active-crop')
        scheduleDraw()
      }

      function cancelItemCrop() {
        state.mode = 'navigate'
        state.cropTarget = null
        cropBanner.classList.add('hidden')
        canvas.classList.remove('cropping')
        for (const r of itemsListEl.querySelectorAll('.item-row')) r.classList.remove('active-crop')
        scheduleDraw()
      }

      async function commitItemCrop(x, y, w, h) {
        const it = state.cropTarget
        if (!it || !state.image) {
          cancelItemCrop()
          return
        }
        if (w < 2 || h < 2) {
          cancelItemCrop()
          return
        }

        // Recorta client-side de la imagen del tipo activo
        const cv = document.createElement('canvas')
        cv.width = w
        cv.height = h
        cv.getContext('2d').drawImage(state.image, x, y, w, h, 0, 0, w, h)
        const blob = await new Promise((r) => cv.toBlob(r, 'image/png'))

        try {
          const res = await fetch(`/save-item/${state.activeRes}/${encodeURIComponent(it.image)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'image/png' },
            body: blob,
          })
          if (!res.ok) throw new Error(await res.text())
          toast(`Guardado ${it.image} (${w}×${h})`)
          await reloadItemThumb(it)
        } catch (err) {
          toast('Error: ' + err.message, true)
        } finally {
          cancelItemCrop()
        }
      }

      // ============================================================================
      // Mouse
      // ============================================================================
      canvas.addEventListener('mousedown', (e) => {
        if (!state.activeType) return
        const rect = canvas.getBoundingClientRect()
        const sx = e.clientX - rect.left,
          sy = e.clientY - rect.top
        const img = s2i(sx, sy)

        if (e.button === 2 || e.button === 1 || (e.button === 0 && state.spaceDown)) {
          state.drag = { kind: 'pan', startScreenX: sx, startScreenY: sy, startOffsetX: state.view.offsetX, startOffsetY: state.view.offsetY }
          canvas.classList.add('panning')
          e.preventDefault()
          return
        }
        if (e.button !== 0) return

        if (state.mode === 'crop-item') {
          state.drag = { kind: 'new-rect', startX: img.x, startY: img.y, currentX: img.x, currentY: img.y }
          return
        }

        const hit = hitTestRegions(img.x, img.y)
        if (hit) {
          selectRegion(hit.region.id)
          if (hit.kind === 'handle') {
            state.drag = { kind: 'resize', region: hit.region, handle: hit.handle, origX: hit.region.x, origY: hit.region.y, origW: hit.region.w, origH: hit.region.h, startImgX: img.x, startImgY: img.y }
          } else {
            state.drag = { kind: 'move', region: hit.region, origX: hit.region.x, origY: hit.region.y, startImgX: img.x, startImgY: img.y }
          }
          return
        }

        if (state.mode === 'rect') {
          state.drag = { kind: 'new-rect', startX: img.x, startY: img.y, currentX: img.x, currentY: img.y }
        } else if (state.mode === 'point') {
          addPoint(img.x, img.y)
        } else {
          state.drag = { kind: 'pan', startScreenX: sx, startScreenY: sy, startOffsetX: state.view.offsetX, startOffsetY: state.view.offsetY }
          canvas.classList.add('panning')
        }
      })

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect()
        const sx = e.clientX - rect.left,
          sy = e.clientY - rect.top
        const img = s2i(sx, sy)
        statusPos.textContent = `x=${img.x} y=${img.y}`

        if (!state.drag) {
          canvas.className = state.mode === 'crop-item' ? 'cropping' : ''
          if (state.mode !== 'crop-item') {
            const hit = hitTestRegions(img.x, img.y)
            if (hit) {
              canvas.classList.add(hit.kind === 'handle' ? 'over-handle' : 'over-region')
            } else if (state.mode === 'navigate') {
              canvas.classList.add('hand')
            }
          }
          return
        }

        const d = state.drag
        if (d.kind === 'pan') {
          state.view.offsetX = d.startOffsetX + (sx - d.startScreenX)
          state.view.offsetY = d.startOffsetY + (sy - d.startScreenY)
        } else if (d.kind === 'new-rect') {
          d.currentX = img.x
          d.currentY = img.y
        } else if (d.kind === 'move') {
          d.region.x = d.origX + (img.x - d.startImgX)
          d.region.y = d.origY + (img.y - d.startImgY)
          markDirty()
          updateListRow(d.region)
          renderEditor()
        } else if (d.kind === 'resize') {
          const dx = img.x - d.startImgX,
            dy = img.y - d.startImgY
          const r = d.region
          if (d.handle === 'nw') {
            r.x = d.origX + dx
            r.y = d.origY + dy
            r.w = d.origW - dx
            r.h = d.origH - dy
          }
          if (d.handle === 'ne') {
            r.y = d.origY + dy
            r.w = d.origW + dx
            r.h = d.origH - dy
          }
          if (d.handle === 'sw') {
            r.x = d.origX + dx
            r.w = d.origW - dx
            r.h = d.origH + dy
          }
          if (d.handle === 'se') {
            r.w = d.origW + dx
            r.h = d.origH + dy
          }
          if (r.w < 0) {
            r.x += r.w
            r.w = -r.w
          }
          if (r.h < 0) {
            r.y += r.h
            r.h = -r.h
          }
          markDirty()
          updateListRow(r)
          renderEditor()
        }
        scheduleDraw()
      })

      window.addEventListener('mouseup', () => {
        if (!state.drag) return
        if (state.drag.kind === 'new-rect') {
          const d = state.drag
          const x = Math.min(d.startX, d.currentX),
            y = Math.min(d.startY, d.currentY)
          const w = Math.abs(d.currentX - d.startX),
            h = Math.abs(d.currentY - d.startY)
          if (state.mode === 'crop-item') {
            commitItemCrop(x, y, w, h)
          } else {
            addRect(x, y, w, h)
          }
        }
        state.drag = null
        canvas.classList.remove('panning')
        if (state.mode === 'navigate') canvas.classList.add('hand')
        scheduleDraw()
      })

      canvas.addEventListener('contextmenu', (e) => e.preventDefault())

      canvas.addEventListener(
        'wheel',
        (e) => {
          if (!state.image) return
          e.preventDefault()
          const rect = canvas.getBoundingClientRect()
          const dy = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 30)
          zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.pow(1.007, -dy))
        },
        { passive: false },
      )

      function zoomAt(sx, sy, factor) {
        const before = s2i(sx, sy)
        state.view.scale = Math.max(0.05, Math.min(20, state.view.scale * factor))
        state.view.offsetX = sx - before.x * state.view.scale
        state.view.offsetY = sy - before.y * state.view.scale
        updateZoomLabel()
        scheduleDraw()
      }
      function zoomCentered(factor) {
        zoomAt(canvas.width / 2, canvas.height / 2, factor)
      }
      function updateZoomLabel() {
        statusZoom.textContent = `zoom: ${Math.round(state.view.scale * 100)}%`
      }

      // ============================================================================
      // Keyboard
      // ============================================================================
      window.addEventListener('keydown', (e) => {
        const mod = e.ctrlKey || e.metaKey
        const k = e.key.toLowerCase()

        // Atajos con modificador van primero y hacen return para que no
        // disparen también los atajos de una sola tecla (p, s...).
        if (mod && k === 's') {
          e.preventDefault()
          save()
          return
        }
        if (mod && k === 'p') {
          e.preventDefault()
          capture()
          return
        }
        if (mod && k === 'z') {
          e.preventDefault()
          revert()
          return
        }

        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
          return
        }

        if (e.key === ' ') {
          state.spaceDown = true
          e.preventDefault()
        }
        if (e.key === 'Delete' || e.key === 'Backspace') {
          if (state.selectedId) {
            deleteRegion(state.selectedId)
            e.preventDefault()
          }
        }
        if (k === 'f') fitImage()
        if (k === 'r') setMode(state.mode === 'rect' ? 'navigate' : 'rect')
        if (k === 'p') setMode(state.mode === 'point' ? 'navigate' : 'point')
        if (k === 'i') toggleIsolate()
        if (e.key === 'Escape') {
          if (state.mode === 'crop-item') cancelItemCrop()
          else {
            setMode('navigate')
            selectRegion(null)
          }
        }
        if (e.key === '+' || e.key === '=') zoomCentered(1.15)
        if (e.key === '-' || e.key === '_') zoomCentered(1 / 1.15)

        if (e.key.startsWith('Arrow')) {
          const r = getRegion(state.selectedId)
          if (!r) return
          const step = e.shiftKey ? 10 : 1
          if (e.key === 'ArrowLeft') r.x -= step
          if (e.key === 'ArrowRight') r.x += step
          if (e.key === 'ArrowUp') r.y -= step
          if (e.key === 'ArrowDown') r.y += step
          markDirty()
          updateListRow(r)
          renderEditor()
          scheduleDraw()
          e.preventDefault()
        }
      })
      window.addEventListener('keyup', (e) => {
        if (e.key === ' ') state.spaceDown = false
      })

      // ============================================================================
      // Mode + isolate + zoom
      // ============================================================================
      function setMode(m) {
        state.mode = m
        $('mode-rect').classList.toggle('active', m === 'rect')
        $('mode-point').classList.toggle('active', m === 'point')
        canvas.className = m === 'navigate' ? 'hand' : m === 'crop-item' ? 'cropping' : ''
      }
      $('mode-rect').addEventListener('click', () => setMode(state.mode === 'rect' ? 'navigate' : 'rect'))
      $('mode-point').addEventListener('click', () => setMode(state.mode === 'point' ? 'navigate' : 'point'))

      function toggleIsolate() {
        state.isolate = !state.isolate
        $('isolate').classList.toggle('active', state.isolate)
        scheduleDraw()
      }
      $('isolate').addEventListener('click', toggleIsolate)

      $('zoom-in').addEventListener('click', () => zoomCentered(1.15))
      $('zoom-out').addEventListener('click', () => zoomCentered(1 / 1.15))
      $('zoom-fit').addEventListener('click', fitImage)

      // ============================================================================
      // Fit
      // ============================================================================
      function fitScale() {
        if (!state.image) return 1
        const margin = 20
        return Math.min((canvas.width - margin * 2) / state.image.width, (canvas.height - margin * 2) / state.image.height, 1)
      }
      function fitImage() {
        if (!state.image) return
        state.view.scale = fitScale()
        state.view.offsetX = (canvas.width - state.image.width * state.view.scale) / 2
        state.view.offsetY = (canvas.height - state.image.height * state.view.scale) / 2
        updateZoomLabel()
        scheduleDraw()
      }

      // ============================================================================
      // Types
      // ============================================================================
      function rebuildTypeSelect() {
        typeSelect.innerHTML = ''
        for (const key of Object.keys(state.coords.types)) {
          const opt = document.createElement('option')
          opt.value = key
          opt.textContent = key
          typeSelect.appendChild(opt)
        }
      }
      function typeToRegions(typeKey) {
        const t = state.coords.types[typeKey]
        if (!t) return []
        const out = []
        for (const r of t.regions || []) out.push({ id: state.nextId++, kind: 'rect', name: r.name, x: r.x, y: r.y, w: r.w, h: r.h })
        for (const p of t.points || []) out.push({ id: state.nextId++, kind: 'point', name: p.name, x: p.x, y: p.y })
        return out
      }
      function typeToItems(typeKey) {
        const t = state.coords.types[typeKey]
        if (!t || !t.items) return []
        return t.items.map((it) => ({ name: it.name, image: it.image, hasImage: false, thumbVer: 0 }))
      }
      function regionsToType(typeKey) {
        const t = state.coords.types[typeKey]
        if (!t) return
        t.regions = state.regions.filter((r) => r.kind === 'rect').map(({ name, x, y, w, h }) => ({ name, x, y, w, h }))
        t.points = state.regions.filter((r) => r.kind === 'point').map(({ name, x, y }) => ({ name, x, y }))
        t.items = state.items.map(({ name, image }) => ({ name, image }))
      }

      async function loadImageForType(typeKey, forceRefresh = false) {
        if (!forceRefresh && state.imagesByType[typeKey]) return state.imagesByType[typeKey]
        const filename = state.coords.types[typeKey]?.image
        if (!filename) return null
        try {
          const url = `/image/${state.activeRes}/${encodeURIComponent(filename)}` + (forceRefresh ? `?_=${Date.now()}` : '')
          const res = await fetch(url)
          if (!res.ok) return null
          const blob = await res.blob()
          return await new Promise((resolve) => {
            const u = URL.createObjectURL(blob)
            const img = new Image()
            img.onload = () => {
              URL.revokeObjectURL(u)
              resolve(img)
            }
            img.onerror = () => {
              URL.revokeObjectURL(u)
              resolve(null)
            }
            img.src = u
          })
        } catch {
          return null
        }
      }

      async function switchType(typeKey) {
        if (state.activeType) regionsToType(state.activeType)
        state.activeType = typeKey
        state.regions = typeToRegions(typeKey)
        state.items = typeToItems(typeKey)
        state.selectedId = null
        activeTypeLabel.textContent = typeKey
        typeSelect.value = typeKey

        await checkItemsHaveImage()
        renderList()
        renderItems()

        const img = await loadImageForType(typeKey)
        if (img) {
          state.imagesByType[typeKey] = img
          state.image = img
          empty.style.display = 'none'
          fitImage()
        } else {
          state.image = null
          const filename = state.coords.types[typeKey]?.image || typeKey + '.png'
          empty.innerHTML = `Falta <code>tools/calibration/${state.activeRes}/${filename}</code><br>Pulsa <b>Capturar tipo</b> (Ctrl+P)`
          empty.style.display = 'flex'
          state.view.scale = 1
          state.view.offsetX = 20
          state.view.offsetY = 20
        }
        scheduleDraw()
      }
      typeSelect.addEventListener('change', () => switchType(typeSelect.value))

      // ============================================================================
      // Resolutions
      // ============================================================================
      async function loadResolutionsList() {
        const res = await fetch('/resolutions')
        state.resolutions = await res.json()
        resSelect.innerHTML = ''
        for (const r of state.resolutions) {
          const opt = document.createElement('option')
          opt.value = r
          opt.textContent = r
          resSelect.appendChild(opt)
        }
      }
      async function switchResolution(wxh) {
        if (state.dirty) {
          const ans = confirm('Hay cambios sin guardar. ¿Guardar antes de cambiar de resolución?')
          if (ans) await save()
          else markClean()
        }
        state.activeRes = wxh
        resSelect.value = wxh
        state.imagesByType = {}
        state.activeType = null
        const res = await fetch(`/coords/${wxh}`)
        if (!res.ok) {
          toast('Error cargando coords', true)
          return
        }
        state.coords = await res.json()
        rebuildTypeSelect()
        const first = Object.keys(state.coords.types)[0]
        if (first) await switchType(first)
      }
      resSelect.addEventListener('change', () => switchResolution(resSelect.value))

      $('res-new').addEventListener('click', async () => {
        const wxh = prompt('Nueva resolución (formato: 1920x1080):', '1920x1080')
        if (!wxh) return
        if (!/^\d{2,5}x\d{2,5}$/.test(wxh)) {
          toast('Formato inválido', true)
          return
        }
        const res = await fetch('/resolutions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wxh }),
        })
        if (!res.ok) {
          toast('Error: ' + (await res.text()), true)
          return
        }
        await loadResolutionsList()
        await switchResolution(wxh)
        toast(`Resolución ${wxh} creada`)
      })

      // ============================================================================
      // Dirty / save / revert
      // ============================================================================
      function markDirty() {
        if (!state.dirty) {
          state.dirty = true
          dirtyIndicator.classList.remove('hidden')
        }
      }
      function markClean() {
        state.dirty = false
        dirtyIndicator.classList.add('hidden')
      }

      async function save() {
        if (state.activeType) regionsToType(state.activeType)
        try {
          const res = await fetch(`/coords/${state.activeRes}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state.coords),
          })
          if (!res.ok) throw new Error(await res.text())
          markClean()
          toast('Guardado')
        } catch (err) {
          toast('Error: ' + err.message, true)
        }
      }
      async function revert() {
        try {
          const res = await fetch(`/coords/${state.activeRes}?_=${Date.now()}`)
          if (!res.ok) throw new Error('no se pudo leer')
          state.coords = await res.json()
          state.regions = typeToRegions(state.activeType)
          state.items = typeToItems(state.activeType)
          state.selectedId = null
          markClean()
          await checkItemsHaveImage()
          renderList()
          renderItems()
          scheduleDraw()
          toast('Revertido al guardado')
        } catch (err) {
          toast('Error: ' + err.message, true)
        }
      }
      $('save').addEventListener('click', save)
      window.addEventListener('beforeunload', (e) => {
        if (state.dirty) {
          e.preventDefault()
          e.returnValue = ''
        }
      })

      // ============================================================================
      // Captura del tipo activo (Ctrl+P)
      // ============================================================================
      let capturing = false
      async function capture() {
        if (capturing || !state.activeType) return
        const filename = state.coords.types[state.activeType]?.image || state.activeType + '.png'
        capturing = true
        try {
          for (let i = 11; i > 0; i--) {
            toast(`Capturando en ${i}...  (cambia a la ventana del juego)`)
            await new Promise((r) => setTimeout(r, 1000))
          }
          const res = await fetch(`/capture/${state.activeRes}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename }),
          })
          if (!res.ok) throw new Error(await res.text())
          const data = await res.json()
          delete state.imagesByType[state.activeType]
          const img = await loadImageForType(state.activeType, true)
          if (img) {
            state.imagesByType[state.activeType] = img
            state.image = img
            empty.style.display = 'none'
            fitImage()
          }
          toast(`Capturado ${filename} (${data.width}×${data.height})`)
        } catch (err) {
          toast('Error: ' + err.message, true)
        } finally {
          capturing = false
        }
      }
      $('capture').addEventListener('click', capture)

      // ============================================================================
      // Toast
      // ============================================================================
      let toastTimer = null
      function toast(msg, isError = false) {
        toastEl.textContent = msg
        toastEl.style.background = isError ? '#b91c1c' : '#059669'
        toastEl.classList.add('visible')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1500)
      }

      // ============================================================================
      // Init
      // ============================================================================
      async function init() {
        window.addEventListener('resize', resizeCanvas)
        resizeCanvas()
        setMode('navigate')

        try {
          await loadResolutionsList()
          if (!state.resolutions.length) {
            empty.textContent = 'No hay resoluciones. Crea una con "+ Nueva".'
            return
          }
          // Default a 4K si existe (si no, la primera alfabética).
          const preferred = state.resolutions.includes('3840x2160')
            ? '3840x2160' : state.resolutions[0]
          await switchResolution(preferred)
        } catch (err) {
          empty.textContent = 'Error: ' + err.message
        }
      }
      init()
    </script>
  </body>
</html>
